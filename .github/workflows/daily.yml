name: daily-update

on:
  schedule:
    - cron: "0 7 * * 1-5"    # UTC 07:00 = 한국 16:00 — 장 마감 직후 (스캔·자문 즉시 갱신)
    - cron: "0 12 * * 1-5"   # UTC 12:00 = 한국 21:00 — 판정 확정 후 최종 갱신
  workflow_dispatch:
    inputs:
      sheet_url:
        description: "구글시트 게시 CSV URL (비워 두면 저장소 변수 SHEET_CSV_URL)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: DB 복원 (최근 artifact → seed release 폴백)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p db
          ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=db&per_page=5" \
               --jq '[.artifacts[] | select(.expired == false)][0].id // empty' || true)
          if [ -n "${ID}" ]; then
            echo "복원: Actions artifact #${ID}"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}/zip" > artifact.zip
            unzip -o artifact.zip -d db/
            rm artifact.zip
          fi
          if [ ! -f db/closing_bet.db ]; then
            echo "복원: seed release"
            gh release download seed --repo "${GITHUB_REPOSITORY}" \
              --pattern closing_seed.zip -O seed.zip
            unzip -o seed.zip -d db/
            mv db/closing_seed.db db/closing_bet.db
            rm seed.zip
          fi
          ls -lh db/

      - name: 구글시트 CSV 가져오기 (선택 · 저장소 변수 SHEET_CSV_URL)
        id: sheet
        env:
          SHEET_CSV_URL: ${{ inputs.sheet_url || vars.SHEET_CSV_URL }}
        run: |
          set -uo pipefail
          if [ -z "${SHEET_CSV_URL:-}" ]; then
            echo "SHEET_CSV_URL 미설정 → 구글시트 연동 생략"
            echo "path=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          out="$RUNNER_TEMP/sheet.csv"
          if curl -fsSL --max-time 60 "$SHEET_CSV_URL" -o "$out" && [ -s "$out" ]; then
            echo "구글시트 CSV 수신: $(wc -c < "$out") bytes"
            echo "path=$out" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::구글시트 CSV 가져오기 실패 — 기존 저장소 데이터로 계속"
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: 갱신 + 스캔 + 정적 발행
        env:
          JOURNAL_EXTRA_CSV: ${{ steps.sheet.outputs.path }}
        run: |
          python run.py refresh
          python run.py scan
          python run.py export

      - name: 알림 전송 (텔레그램 → 디스코드 → GitHub 이슈)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python run.py notify

      - name: WAL 정리
        run: python -c "import sqlite3; c = sqlite3.connect('db/closing_bet.db'); print(c.execute('PRAGMA wal_checkpoint(TRUNCATE)').fetchone()); c.close()"

      - name: "DB 백업 저장 (이름 db, 90일 보관)"
        uses: actions/upload-artifact@v4
        with:
          name: db
          path: db/closing_bet.db
          retention-days: 90
          if-no-files-found: error

      - name: Pages 배포 아티팩트 준비
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
